services:
  jesselicious:
    image: ghcr.io/inlitx/jesselicious:latest
    build: .
    container_name: jesselicious
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    ports:
      - "${JESSELICIOUS_PORT:-8080}:8080"
    volumes:
      - ./jesselicious-data:/data
    environment:
      JESSELICIOUS_PASSWORD: ${JESSELICIOUS_PASSWORD:-}
      JESSELICIOUS_PEOPLE: ${JESSELICIOUS_PEOPLE:-}
      JESSELICIOUS_SYNC: ${JESSELICIOUS_SYNC:-}
      JESSELICIOUS_KEEP_DAYS: ${JESSELICIOUS_KEEP_DAYS:-}

  syncthing:
    image: syncthing/syncthing:latest
    container_name: jesselicious-syncthing
    restart: unless-stopped
    profiles: ["sync"]
    hostname: jesselicious
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    ports:
      - "8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    volumes:
      - ./syncthing:/var/syncthing
      - ./jesselicious-data/sync:/var/syncthing/Jesselicious
      - ./jesselicious-data:/var/syncthing/data
